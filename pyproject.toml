[project]
name = "q3as"
version = "0.3.0"
description = "Qwen 3 Ada SPARK (q3as) - Fine-tuning pipeline for the full Ada language spectrum"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache 2.0"
authors = [
    {name = "q3as Contributors"},
]
dependencies = [
    "pydantic>=2.10.0",
    "datasets>=3.0.0",
    "unsloth>=2025.0.0",
    "torch>=2.6.0",
    "transformers>=4.48.0",
    "triton>=3.0.0",
    "hf-transfer>=0.1.0",
    "huggingface_hub>=0.28.0",
    "python-dotenv>=1.2.0",
    "accelerate>=0.34.0",
    "peft>=0.14.0",
    "trl>=0.12.0",
]

[tool.uv.sources]
ada-eval = { path = "data/raw_repos/AdaCore/ada-eval", editable = false }

[tool.uv]
package = false
# The ast group ships the pure-Python part of the libadalang bindings (the
# ctypes wrapper that dlopens libadalang.so). The shared library itself is
# compiled by `make ast-deps`; without it the wrapper import fails and the AST
# parser falls back to its structural scanner. Keeping the group in the
# default set means plain `uv sync` and `uv run` do not prune it again.
default-groups = ["dev", "ast"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0",
    "ada-eval",
]
ast = [
    # Pure-Python libadalang bindings from the official release archive (the
    # same one the Alire `libadalang` crate deploys). No PyPI distribution
    # exists; the native library is built separately by scripts/build_libadalang.py.
    "libadalang @ https://github.com/AdaCore/libadalang/releases/download/v24.0.0/libadalang-24.0.0.tar.gz#subdirectory=python",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
# target-version is deliberately unset: ruff infers it from
# [project] requires-python above, so the two cannot drift apart.

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
