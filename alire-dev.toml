# Development manifest for local SPARK proof verification and testing.
# Used exclusively by eval commands (make prove, eval/eval_pipeline.py,
# eval/baseline_eval.py) which run gnatprove and gprbuild against this
# manifest. alire.toml is never polluted.
#
# gnatprove lives here (NOT in the publishing alire.toml), so q3as
# stays zero-dependency for publishing purposes. The eval pipeline
# resolves gnatprove from this dev manifest via alr exec.

name = "q3as"
description = "Qwen 3 Ada SPARK fine-tuning pipeline with evaluation"
version = "0.4.0"
project-files = []

authors = ["bladeacer"]
maintainers = ["bladeacer <wg.nick.exe@gmail.com>"]
maintainers-logins = ["bladeacer"]
licenses = "Apache-2.0"
website = "https://github.com/bladeacer/q3as"

tags = ["ada", "spark", "fine-tuning", "evaluation", "code-generation"]

[[depends-on]]
# Version notes:
# - gnatprove and gnatformat resolve to the modern binary releases from the
#   community index (branch stable-1.4.0). Old `alr` releases (e.g. 1.2.1 on
#   Debian) cannot read that branch, so setup.sh registers the repo-local
#   q3as-local-index/ (a vendored mirror of the needed crates) ahead of the
#   community index; new alr releases read stable-1.4.0 directly.
# - gnatdoc is not pinned: it exists only as a long source build and q3as
#   never calls it.
gnatprove = "^16.1.0"
gnatformat_bin = "^26.0.0"
